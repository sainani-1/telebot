services:
  successkart:
    build: .
    container_name: successkart-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - successkart_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3; c=sqlite3.connect(os.getenv('DATABASE_PATH','/data/successkart.db')); c.execute('SELECT 1'); c.close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  successkart_data:
